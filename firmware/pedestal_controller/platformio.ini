; PlatformIO Project Configuration File

[env]
# Force a modern platform version supporting modern C++ standards
platform = espressif32@^6.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = pololu/VL53L1X@^1.3.1

# Clear out the legacy language definitions
build_unflags = 
    -std=gnu++11
    -std=gnu++14
    -std=gnu++17

# Explicitly request gnu++17 (or gnu++2a / gnu++23 if desired)
build_flags = 
    -std=gnu++17

; Environment for your main application
[env:main]
build_unflags = ${env.build_unflags}
build_flags = ${env.build_flags}
build_src_filter = +<main.cpp>

; Environment for your test application
[env:test]
build_unflags = ${env.build_unflags}
build_flags = ${env.build_flags}
build_src_filter = +<main-test.cpp>
